// Pages have to receive every shortcut; a site that swallows a key would
// otherwise hide it from Tridactyl too.
defaultPref("permissions.default.shortcuts", 0);
// Keep Alt for Tridactyl's Alt-x command prompt instead of focusing the menu bar.
defaultPref("ui.key.menuAccessKeyFocuses", false);
// Firefox' own quick find on "/" would compete with the find prompt bound there.
defaultPref("accessibility.typeaheadfind.manual", false);
// Backspace outside a text field would go back a page; 2 leaves it alone.
defaultPref("browser.backspace_action", 2);

const { classes: Cc, interfaces: Ci, results: Cr } = Components;

// Firefox resolves these shortcuts below the page, in the keyset of
// main-window.xhtml, so no extension can see the key until the key element is
// gone. Only the keys Tridactyl needs are listed: the rest of that keyset,
// including the internal="true" entries that carry copy, paste and undo, and
// the Tab and C-l keys the browser chrome itself is driven by, has to stay.
const SHORTCUTS_TO_DROP = [
  "key_newNavigator", // C-n, new window
  "key_newNavigatorTab", // C-t, new tab
  "key_close", // C-w, close tab
  "key_closeWindow", // C-S-w, close window
  "key_restoreLastClosedTabOrWindowOrSession", // C-S-t, reopen closed tab
  "key_quitApplication", // C-q, quit Firefox
  "key_find", // C-f, find bar
  "key_findAgain", // C-g, find again
  "key_findPrevious", // C-S-g, find previous
  "printKb", // C-p, print
  "viewBookmarksSidebarKb", // C-b, bookmarks sidebar
  "key_viewSource", // C-u, page source
  "addBookmarkAsKb", // C-d, bookmark this page
];

const dropShortcuts = {
  observe(subject, topic) {
    // "chrome-document-loaded" hands over the document, the startup notification
    // hands over the window it belongs to.
    const doc = topic === "chrome-document-loaded" ? subject : subject?.document;
    if (!doc || doc.documentElement?.getAttribute("id") !== "main-window") return;
    const keyset = doc.getElementById("mainKeyset");
    if (!keyset) return;
    for (const id of SHORTCUTS_TO_DROP) {
      keyset.querySelector("#" + id)?.remove();
    }
    // --- probe, not part of the repository ---
    try {
      const rest = SHORTCUTS_TO_DROP.filter(id => doc.getElementById(id));
      const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      file.initWithPath("/tmp/autoconfig-probe.txt");
      const stream = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
      stream.init(file, 0x02 | 0x08 | 0x10, 0o644, 0);
      const line = "topic=" + topic + " left=[" + rest.join(",") + "] keyset=" + !!doc.getElementById("mainKeyset") + "\n";
      stream.write(line, line.length);
      stream.close();
    } catch (e) {}
  },
  QueryInterface(iid) {
    if (iid.equals(Ci.nsIObserver) || iid.equals(Ci.nsISupports)) return this;
    throw Cr.NS_NOINTERFACE;
  },
};

const observerService = Cc["@mozilla.org/observer-service;1"].getService(
  Ci.nsIObserverService,
);
observerService.addObserver(dropShortcuts, "chrome-document-loaded");
observerService.addObserver(dropShortcuts, "browser-delayed-startup-finished");
